apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: platform-ops-api
  namespace: portfolio
  labels:
    app: platform-ops-api
spec:
  podSelector:
    matchLabels:
      app: platform-ops-api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow traffic from the NGINX ingress controller namespace
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8000
    # Allow Prometheus scraping from the monitoring namespace
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8000
  egress:
    # Allow DNS resolution
    - ports:
        - protocol: UDP
          port: 53
    # Allow HTTPS to external services (ECR, AWS APIs)
    - ports:
        - protocol: TCP
          port: 443
