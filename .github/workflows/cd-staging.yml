name: CD – Staging

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

env:
  ENVIRONMENT: staging
  AWS_REGION: us-east-1
  ECR_REPOSITORY: platform-ops
  K8S_NAMESPACE: portfolio

jobs:
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_STAGING }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Resolve image tag
        id: image
        run: |
          TAG="sha-$(git rev-parse --short HEAD)"
          URI="${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${TAG}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "uri=${URI}" >> "$GITHUB_OUTPUT"

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region "${{ env.AWS_REGION }}" \
            --name "platform-ops-${{ env.ENVIRONMENT }}"

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/configmap.yaml
          kubectl apply -f k8s/secret.yaml
          # Patch the deployment image with the versioned tag
          kubectl set image deployment/platform-ops-api \
            api="${{ steps.image.outputs.uri }}" \
            -n "${{ env.K8S_NAMESPACE }}"
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/ingress.yaml
          kubectl apply -f k8s/hpa.yaml
          kubectl apply -f k8s/pdb.yaml
          kubectl apply -f k8s/networkpolicy.yaml

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/platform-ops-api \
            -n "${{ env.K8S_NAMESPACE }}" \
            --timeout=5m

      - name: Health check
        id: healthcheck
        run: |
          INGRESS_IP=$(kubectl get ingress platform-ops-api \
            -n "${{ env.K8S_NAMESPACE }}" \
            -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "http://${INGRESS_IP}/health")
          if [ "$STATUS" != "200" ]; then
            echo "Health check failed with status: $STATUS"
            exit 1
          fi
          echo "Health check passed"

      - name: Rollback on failure
        if: failure() && steps.healthcheck.outcome == 'failure'
        run: |
          echo "Health check failed — rolling back deployment"
          kubectl rollout undo deployment/platform-ops-api \
            -n "${{ env.K8S_NAMESPACE }}"
          kubectl rollout status deployment/platform-ops-api \
            -n "${{ env.K8S_NAMESPACE }}" \
            --timeout=3m
